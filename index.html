<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Voice</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rock+Salt&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="grid-container">
            <h2>Tic-Tac-Toe</h2>
            <div class="board-2d" id="board-2d"></div>
            <div class="voice-controls">
                <button class="btn-reset" id="btn-reset">Reset</button>
                <p class="voice-status" id="voice-status">Say a cell like "top center". Say "easy", "medium" or "hard" to change the AI, or "reset" to start over.</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
